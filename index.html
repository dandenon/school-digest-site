<h1>School Digest</h1>
<p>A personal app that summarizes school emails for one family and adds test dates to the family's calendars.</p>
<h2>Privacy</h2>
<p>Used only by its owner. Email and calendar data is read only to produce the family's weekly summary. It is not sold, shared, or used for anything else.</p>
